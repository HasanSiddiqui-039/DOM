<!DOCTYPE html>
<html>

<head>
    <title>DOM Manipulation Practice</title>

    <style>
        .redText {
            color: red;
        }
    </style>
</head>

<body>

    <h2 id="text">My name is Hasan</h2>

    <input id="name">

    <button onclick="changeMe()">Click here!</button>
    <button onclick="clickme()">Click Me!</button>

    <script>

        // 1. getElementById()
        let text = document.getElementById("text");


        // 2. innerText
        function changeMe() {
            text.innerText = "Hello Hasan";


            // 3. style
            text.style.color = "blue";


            // 4. style.fontSize
            text.style.fontSize = "30px";
        }


        // 5. value
        function clickme() {
            let name = document.getElementById("name").value;


            // 6. innerText
            text.innerText = "Welcome " + name;
        }


        // 7. querySelector()
        let heading = document.querySelector("#text");


        // 8. classList.add()
        heading.classList.add("redText");


        // 9. classList.remove()
        heading.classList.remove("redText");


        // 10. setAttribute()
        document.getElementById("name")
            .setAttribute("placeholder", "Enter your name");


        // 11. getAttribute()
        let idName = document.getElementById("name")
            .getAttribute("id");

        console.log(idName);


        // 12. createElement()
        let para = document.createElement("p");


        // 13. appendChild()
        para.innerText = "This is a new paragraph";
        document.body.appendChild(para);


        // 14. append()
        let para2 = document.createElement("p");
        para2.innerText = "This paragraph was added using append";
        document.body.append(para2);


        // 15. remove()
        // para2.remove();

    </script>

</body>

</html>
